# The World Ledger — the current state of Calderra.
# DM truth. Only fields marked PUBLIC reach the player map.
# Update this after every session, together with a file in ledger/sessions/.

# PUBLIC. 0–10, starts at 5. +1 when heroes protect people, make peace or stop a warlord;
# -1 for a burnt town, a dead claimant or a broken treaty.
realm_peace: 6

# standing: -2 enemy … +2 ally. PUBLIC as a reputation word (Hostile/Wary/Neutral/Friendly/Allied)
# unless known_to_players is false, which shows "Unknown". `reason` is private.
factions:
  dawn-lantern:
    standing: 1
    reason: MAX vouches for the Lantern-sworn after the Festival.
  regency:
    standing: 0
    reason: Not met yet.
  ironhart:
    standing: 0
    reason: Saved the bridge and the wall's winter bread, but promised Varn the land north of the river with no authority to do it. The Ford-folk are grateful. Brenna will not be once she hears.
  saltreach:
    standing: 0
    reason: Not met yet.
  stonecrown:
    standing: 0
    reason: Not met yet.
  ashen-pretender:
    standing: 0
    known_to_players: false
    reason: Doesn't know the Lantern-sworn exist, for now.

# The Crown vanished; a new one must be forged from all three gems (world/sunfire-crown.md).
# Gems are held by NPCs in the world between sessions (often the Order), never by PCs.
# location, holder and known_by are private. Set revealed: true and fill public_location
# to show a gem on the map.
gems:
  heart:
    name: The Heart gem
    location: Under the Regent's palace in Solace
    holder: Regent Lysander
    known_by: Regent Lysander only
    revealed: false
    public_location: ""
  will:
    name: The Will gem
    location: Carried by the Ashen Pretender
    holder: The Ashen Pretender
    known_by: His herald Kestrel
    revealed: false
    public_location: ""
  mind:
    name: The Mind gem
    location: In the dead roots of the Challenger under the Millhaven coliseum
    holder: Nobody (leaking; Millhaven's children share dreams)
    known_by: Nobody
    revealed: false
    public_location: ""

# Important objects other than gems. Private. Like gems, held by NPCs between sessions.
items:
  max-key:
    name: MAX's iron key
    holder: Given to the Festival heroes. If no Festival PC returns for The Millhaven Harvest, they left it with Ser Maren at the Lanternhold.
    opens: Marit's lockbox at the Broken Antler (world/factions/ashen-pretender.md)

# Consequences the players haven't learned yet. Private until the session for `reveal_after` is logged;
# from then on the build applies them on top of the values above, every build. Don't fold them in by hand.
# realm_peace and a faction's standing are deltas (+1, -2). A faction reason or a region's public field
# (held_by, feel, rumour) replaces the old one. `note` is private and never shown.
deferred:
  harrows-ford-aftermath:
    reveal_after: millhaven-harvest
    note: The Regency's company tried to retake the north bank, Varn killed them, burned Harrow's Ford and destroyed the bridge. Edda tells the heroes in Millhaven. Full story in ledger/sessions/01-harrows-ford.md.
    realm_peace: -2   # a burned village and a broken treaty
    factions:
      ironhart:
        standing: -1
        reason: The heroes promised Varn her north bank. Gromm sent for the Regent's soldiers instead of hers, the Regent's company started a war in her March, and Harrow's Ford burned. Brenna blames Lysander first and the Lantern-sworn second.
      regency:
        reason: Answered Gromm's call for help at Harrow's Ford and lost the company it sent (Captain Aurel Dane). Lysander blames Brenna's empty garrisons.
    regions:
      march-of-thorns:
        rumour: "Harrow's Ford burned, bridge and all. Refugees on the north road say a Regency company crossed the river first, and none of them came back."

# PUBLIC. Retired PCs who may return as NPCs.
# - name: "Character name"
#   player: "Player name"
#   from: festival-of-the-accord   # adventure id
legacy_heroes: []
